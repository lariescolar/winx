<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma - Olimpíadas da Advocacia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-white font-[Montserrat,sans-serif] text-gray-800 antialiased">

  <header class="sticky top-0 z-50 border-b border-gray-100 bg-white">
    <div class="navbar mx-auto flex max-w-7xl items-center justify-between px-4 py-3 md:px-12">

      <a href="index.html" class="flex flex-1 items-center">
        <img
          src="assets/img/logo-olimpiadas.png"
          alt="Olimpíadas da Advocacia CONCAD 2023"
          class="h-10 object-contain md:h-12"
        >
      </a>

      <nav class="hidden items-center gap-6 text-xs font-semibold lg:flex">
        <a href="index.html" class="text-[#4a5568] hover:text-[#00a3e0]">Home</a>
        <a href="modalidades.html" class="text-[#4a5568] hover:text-[#00a3e0]">Modalidades</a>
        <a href="noticias.html" class="text-[#4a5568] hover:text-[#00a3e0]">Notícias</a>
        <a href="cronograma.html" class="font-bold text-[#00a3e0]">Cronograma</a>
        <a href="#" class="text-[#4a5568] hover:text-[#00a3e0]">Resultados</a>
        <a href="#" class="text-[#4a5568] hover:text-[#00a3e0]">Administradores</a>
        <a href="#" class="text-[#4a5568] hover:text-[#00a3e0]">Regulamento</a>
      </nav>

      <div class="dropdown dropdown-end lg:hidden">
        <button tabindex="0" class="btn btn-ghost btn-circle" aria-label="Abrir menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <ul tabindex="0" class="menu dropdown-content z-10 mt-3 w-56 rounded-box border border-gray-100 bg-white p-2 shadow-xl">
          <li><a href="index.html">Home</a></li>
          <li><a href="modalidades.html">Modalidades</a></li>
          <li><a href="noticias.html">Notícias</a></li>
          <li><a href="cronograma.html" class="font-bold text-[#00a3e0]">Cronograma</a></li>
          <li><a href="modalidade.html">Detalhe da modalidade</a></li>
          <li><a href="noticia.html">Notícia</a></li>
        </ul>
      </div>

    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-grow px-4 py-8 md:px-8">

    <section>
      <div class="mb-5 flex items-center justify-between gap-3">
        <h1 class="text-lg font-extrabold uppercase">Cronograma geral</h1>

        <div class="flex gap-3">
          <button id="anterior" class="btn btn-circle btn-sm btn-outline" aria-label="Semana anterior">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="m15 18-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button id="proximo" class="btn btn-circle btn-sm btn-outline" aria-label="Próxima semana">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="calendario" class="grid grid-cols-2 overflow-x-auto rounded-lg border border-gray-200 sm:grid-cols-3 lg:grid-cols-6"></div>

      <p id="semana-info" class="mt-2 text-right text-xs text-gray-400"></p>
    </section>

    <section class="mt-12">
      <h2 class="mb-4 text-lg font-extrabold uppercase">Cronograma por modalidades</h2>
      <div id="modalidades" class="w-full"></div>
    </section>

  </main>

  <footer class="mt-auto border-t border-gray-200 bg-[#f4f4f4] py-6">
    <div class="mx-auto flex max-w-5xl flex-col items-center justify-between gap-4 px-4 text-xs text-gray-500 sm:flex-row md:px-8">
      <a href="index.html">
        <img
          src="assets/img/logo-olimpiadas.png"
          alt="Olimpíadas da Advocacia"
          class="h-9 object-contain"
        >
      </a>

      <span>2023 HC Sports. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script>
    const imagensEsportes = {
      'Basquete 3x3': 'assets/img/basquete-logo.png',
      'Beach Tennis': 'assets/img/beach-tenis.png',
      'Corrida de Rua': 'assets/img/corrida-logo.png',
      'Crossfit': 'assets/img/crossfit-logo.png',
      'Futebol 11': 'assets/img/futebol-logo.png',
      'Futebol 7': 'assets/img/futebol-logo.png',
      'Futebol Society': 'assets/img/futebol-logo.png',
      'Futebol de Mesa': 'assets/img/futebol-logo.png',
      'Futevôlei': 'assets/img/volei-logo.png',
      'Jiu-jítsu': 'assets/img/luta-logo.png',
      'Judô': 'assets/img/luta-logo.png',
      'Natação': 'assets/img/natacao-logo.png',
      'Sinuca': 'assets/img/sinuca-logo.png',
      'Tênis': 'assets/img/tenis-logo.png',
      'Tênis de Mesa': 'assets/img/tenis-logo.png',
      'Tiro Esportivo': 'assets/img/tiro-logo.png',
      'Vôlei de Quadra': 'assets/img/volei-logo.png',
      'Vôlei de Praia': 'assets/img/volei-logo.png',
      'Xadrez': 'assets/img/xadrez-logo.png'
    };

    const dias = [
      {
        nome: 'Seg',
        numero: 3,
        jogos: [
          ['08:00 - 11:00', 'Vôlei de Quadra'],
          ['11:20 - 13:00', 'Natação'],
          ['14:30 - 17:00', 'Futebol Society'],
          ['16:00 - 18:00', 'Judô']
        ]
      },
      {
        nome: 'Ter',
        numero: 4,
        jogos: [
          ['08:00 - 11:00', 'Basquete 3x3'],
          ['10:00 - 13:00', 'Futebol 11'],
          ['14:30 - 16:00', 'Futebol 7'],
          ['16:20 - 18:00', 'Futebol Society'],
          ['14:30 - 18:00', 'Jiu-jítsu'],
          ['16:00 - 18:00', 'Judô']
        ]
      },
      {
        nome: 'Qua',
        numero: 5,
        jogos: [
          ['08:00 - 11:00', 'Vôlei de Quadra'],
          ['08:00 - 11:00', 'Basquete 3x3'],
          ['10:00 - 13:00', 'Natação'],
          ['14:30 - 18:00', 'Jiu-jítsu'],
          ['15:00 - 18:00', 'Corrida de Rua']
        ]
      },
      {
        nome: 'Qui',
        numero: 6,
        jogos: [
          ['08:00 - 11:00', 'Vôlei de Quadra'],
          ['11:20 - 13:00', 'Natação'],
          ['14:30 - 17:00', 'Futebol Society'],
          ['16:00 - 18:00', 'Judô']
        ]
      },
      {
        nome: 'Sex',
        numero: 7,
        jogos: [
          ['08:00 - 11:00', 'Basquete 3x3'],
          ['10:00 - 13:00', 'Futebol 11'],
          ['14:30 - 16:00', 'Futebol 7'],
          ['16:20 - 18:00', 'Futebol Society'],
          ['14:30 - 18:00', 'Jiu-jítsu'],
          ['16:00 - 18:00', 'Judô']
        ]
      },
      {
        nome: 'Sáb',
        numero: 8,
        jogos: [
          ['08:00 - 11:00', 'Vôlei de Quadra'],
          ['08:00 - 11:00', 'Basquete 3x3'],
          ['10:00 - 13:00', 'Natação'],
          ['14:30 - 18:00', 'Jiu-jítsu'],
          ['15:00 - 18:00', 'Corrida de Rua']
        ]
      }
    ];

    const listaModalidades = [
      'Basquete 3x3',
      'Beach Tennis',
      'Corrida de Rua',
      'Crossfit',
      'Futebol 11',
      'Futebol 7',
      'Futebol Society',
      'Futebol de Mesa',
      'Futevôlei',
      'Jiu-jítsu',
      'Judô',
      'Natação',
      'Sinuca',
      'Tênis',
      'Tênis de Mesa',
      'Tiro Esportivo',
      'Vôlei de Quadra',
      'Vôlei de Praia',
      'Xadrez'
    ];

    const jogosFutebol = [
      ['03/07/2023', '09h00', 'Lorem Ipsum is simply dummy text', 'Jogo 1', 'Grupo A', 'Equipe 1 x Equipe 2'],
      ['03/07/2023', '11h00', 'Lorem Ipsum is simply dummy text', 'Jogo 2', 'Grupo A', 'Equipe 2 x Equipe 3'],
      ['03/07/2023', '14h00', 'Lorem Ipsum is simply dummy text', 'Jogo 3', 'Grupo A', 'Equipe 1 x Equipe 3'],
      ['04/07/2023', '10h00', 'Lorem Ipsum is simply dummy text', 'Jogo 4', 'Grupo A', 'Final'],
      ['04/07/2023', '15h00', 'Lorem Ipsum is simply dummy text', 'Jogo 5', 'Grupo A', '2º melhor colocado x 3º melhor colocado']
    ];

    function criarIcone(modalidade) {
      const caminho = imagensEsportes[modalidade];

      if (caminho) {
        return `
          <span class="inline-flex h-[19px] w-[19px] shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#383838]">
            <img src="${caminho}" alt="" class="h-[13px] w-[13px] object-contain">
          </span>
        `;
      }

      return `
        <span class="inline-flex h-[19px] w-[19px] shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#383838]"></span>
      `;
    }

    const calendario = document.getElementById('calendario');
    const semanaInfo = document.getElementById('semana-info');
    let deslocamentoSemana = 0;

    function mostrarCalendario() {
      calendario.innerHTML = '';

      dias.forEach((dia) => {
        const coluna = document.createElement('div');
        coluna.className = 'min-w-0 border-r border-gray-200 last:border-r-0';

        const numero = dia.numero + deslocamentoSemana * 7;

        coluna.innerHTML = `
          <div class="border-b border-gray-200 bg-gray-50 px-2 py-3 text-center">
            <div class="text-xs font-semibold">${dia.nome}</div>

            <div class="mx-auto mt-1 flex h-7 w-7 items-center justify-center rounded-full bg-gray-800 text-xs font-bold text-white">
              ${numero}
            </div>
          </div>

          <div class="flex flex-col gap-1.5 p-1.5">
            ${dia.jogos.map(jogo => `
              <div class="min-w-0 rounded-[5px] border border-[#dedede] bg-white px-1.5 py-[7px]">
                <p class="mb-[5px] text-[10px] text-[#555]">${jogo[0]}</p>

                <div class="flex items-center gap-1 text-[10px] font-medium leading-[1.4]">
                  ${criarIcone(jogo[1])}
                  <span>${jogo[1]}</span>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        calendario.appendChild(coluna);
      });

      semanaInfo.textContent = deslocamentoSemana === 0
        ? 'Semana de referência do modelo'
        : `Visualização ${deslocamentoSemana > 0 ? '+' : ''}${deslocamentoSemana} semana(s)`;

      document.getElementById('anterior').disabled = deslocamentoSemana <= 0;
    }

    function montarTabela(jogos) {
      return `
        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="w-full border-collapse">
            <tbody>
              ${jogos.map(jogo => `
                <tr>
                  ${jogo.map(celula => `
                    <td class="whitespace-nowrap border border-[#e5e5e5] p-3 text-left text-[11px] max-sm:p-2 max-sm:text-[10px]">
                      ${celula}
                    </td>
                  `).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function mostrarModalidades() {
      const container = document.getElementById('modalidades');

      container.innerHTML = listaModalidades.map((modalidade, indice) => {
        const aberta = modalidade === 'Futebol 11';

        return `
          <div class="border-b border-[#e5e5e5]">
            <button
              type="button"
              class="flex w-full items-center gap-2 py-2.5 text-left text-xs ${aberta ? 'text-[#00a3e0]' : 'text-[#444]'}"
              aria-expanded="${aberta}"
              aria-controls="modalidade-${indice}"
              id="botao-modalidade-${indice}"
            >
              ${criarIcone(modalidade)}

              <span>${modalidade}</span>

              <svg class="ml-auto h-4 w-4 shrink-0 transition-transform duration-200 ${aberta ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="m6 9 6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <div id="modalidade-${indice}" class="${aberta ? 'pb-3' : 'hidden'}">
              ${aberta
                ? montarTabela(jogosFutebol)
                : '<p class="pb-3 pl-7 text-xs text-gray-500">Horários e confrontos a confirmar.</p>'
              }
            </div>
          </div>
        `;
      }).join('');

      listaModalidades.forEach((modalidade, indice) => {
        const botao = document.getElementById(`botao-modalidade-${indice}`);
        const conteudo = document.getElementById(`modalidade-${indice}`);

        botao.addEventListener('click', () => {
          const estavaAberta = botao.getAttribute('aria-expanded') === 'true';
          const icone = botao.querySelector('svg');
          const circulo = botao.querySelector('span.inline-flex');

          botao.setAttribute('aria-expanded', String(!estavaAberta));

          conteudo.classList.toggle('hidden', estavaAberta);
          conteudo.classList.toggle('pb-3', !estavaAberta);

          botao.classList.toggle('text-[#00a3e0]', !estavaAberta);
          botao.classList.toggle('text-[#444]', estavaAberta);

          icone.classList.toggle('rotate-180', !estavaAberta);

          if (circulo) {
            circulo.classList.toggle('bg-[#00a3e0]', !estavaAberta);
            circulo.classList.toggle('bg-[#383838]', estavaAberta);
          }
        });
      });
    }

    document.getElementById('anterior').addEventListener('click', () => {
      if (deslocamentoSemana > 0) {
        deslocamentoSemana--;
        mostrarCalendario();
      }
    });

    document.getElementById('proximo').addEventListener('click', () => {
      deslocamentoSemana++;
      mostrarCalendario();
    });

    mostrarCalendario();
    mostrarModalidades();
  </script>

</body>
</html>
