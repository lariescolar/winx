<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Módulo 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
</head>

<body>
  <!-- SEÇÃO: HEADER (responsável: integrante A) -->
  <!-- SEÇÃO: HERO (responsável: integrante B) -->
<section
class="hero min-h-[650px] bg-cover bg-center sm:min-h-[600px]"
style="
  background-image:
    linear-gradient(
      90deg,
      rgba(5, 71, 135, 0.85) 0%,
      rgba(5, 105, 175, 0.65) 45%,
      rgba(0, 150, 220, 0.15) 100%
    ),
    url('img/piscina.png.jpg');
"
>
<div class="hero-content w-full max-w-6xl justify-start px-5 py-24 text-left text-white sm:px-8 md:px-10 lg:py-32">

  <div class="w-full max-w-2xl">

    <!-- TÍTULO -->
    <h1
      class="text-3xl font-bold leading-tight sm:text-4xl md:text-5xl lg:text-6xl"
    >
      <span class="text-orange-400">
        Experiência no DNA
      </span>
      na fabricação de piscinas de fibra
    </h1>

    <!-- DESCRIÇÃO -->
    <p
      class="mt-5 max-w-xl text-sm leading-6 text-white/90 sm:mt-6 sm:text-base sm:leading-7"
    >
      Uma nova marca que já nasce com 25 anos de história para contar.
      A Nobre Piscinas possui em seu DNA a experiência de produzir
      piscinas de fibra de vidro.
    </p>

    <!-- BOTÕES -->
    <div class="mt-7 flex w-full flex-col gap-3 sm:mt-8 sm:w-auto sm:flex-row">

      <a
        href="#sobre"
        class="btn w-full border-none bg-orange-400 text-white hover:bg-orange-500 sm:w-auto"
      >
        »&nbsp; Conheça nossa história
      </a>

      <a
        href="#piscinas"
        class="btn btn-outline w-full border-white text-white hover:border-white hover:bg-white hover:text-blue-900 sm:w-auto"
      >
        Ver piscinas
      </a>

    </div>

  </div>

</div>
</section>

  <!-- SEÇÃO: CARDS (responsável: integrante C) -->
  <!-- SEÇÃO: FAQ (responsável: integrante D) -->
  <!-- SEÇÃO: FOOTER (responsável: integrante E) -->
</body>

</html>
