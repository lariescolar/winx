<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Módulo 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
</head>

<body>

  <!-- SEÇÃO: HEADER (responsável: integrante A) -->
    <header>
    <div class="navbar bg-[#263b7a] text-white">

        <!-- Logo -->
        <div class="navbar-start lg:ml-[15%]">
            <a>
                <img src="assets/img/logo.png"
                    alt="Logo"
                    class="w-24">
            </a>
        </div>

        <!-- Menu para computador -->
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal items-center gap-2">

                <!-- Instagram -->
                <li>
                    <a>
                        <img src="assets/img/instagram.png"
                            alt="Instagram"
                            class="w-6 h-6">
                    </a>
                </li>

                <!-- WhatsApp -->
                <li>
                    <a>
                        <img src="assets/img/whatsapp.png"
                            alt="WhatsApp"
                            class="w-6 h-6">
                    </a>
                </li>

                <!-- Links -->
                <li><a>Sobre</a></li>
                <li><a>Piscinas</a></li>
                <li><a>Orçamentos</a></li>
                <li><a>Garantia</a></li>
                <li><a>Contatos</a></li>

            </ul>
        </div>

        <!-- Menu para celular -->
        <div class="navbar-end lg:hidden">
            <div class="dropdown dropdown-end">

                <div tabindex="0"
                    role="button"
                    class="btn btn-ghost text-white">
                    ☰
                </div>

                <ul tabindex="0"
                    class="menu menu-sm dropdown-content bg-base-100 text-black rounded-box z-10 mt-3 w-52 p-2 shadow">

                    <li><a>Sobre</a></li>
                    <li><a>Piscinas</a></li>
                    <li><a>Orçamentos</a></li>
                    <li><a>Garantia</a></li>
                    <li><a>Contatos</a></li>

                </ul>

            </div>
        </div>

    </div>
    </header>
  <!-- SEÇÃO: HERO (responsável: integrante B) -->
  <!-- SEÇÃO: CARDS (responsável: integrante C) -->
  <!-- SEÇÃO: FAQ (responsável: integrante D) -->
  <!-- SEÇÃO: FOOTER (responsável: integrante E) -->
</body>
</html>
